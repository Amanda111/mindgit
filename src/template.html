<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen workbench. Editable map on graph paper, a side ledger (overview / Markdown source), a commit rail along the bottom. */
:root {
  --bg: #eef1ee;
  --paper: #f6f8f5;
  --surface: #ffffff;
  --ink: #17201c;
  --muted: #5b6862;
  --faint: #8a9690;
  --line: #d5dcd7;
  --grid: #d0d8d2;
  --change: #2f5fe0;
  --change-soft: rgba(47, 95, 224, .13);
  --done: #1d8a50;
  --doing: #c27408;
  --todo: #7b8782;
  --paused: #a24f4f;
  --b0: #0f8273; --b1: #4659cc; --b2: #b86d0a; --b3: #b23b62; --b4: #5c7d1a; --b5: #7a4cbb;
  --on-branch: #ffffff;
  --root-bg: #17201c; --root-fg: #f6f8f5;
  --shadow: rgba(23, 32, 28, .14);
  --font-sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --paper: #131916; --surface: #1a211e; --ink: #e2e8e4; --muted: #9aa7a0; --faint: #6c7a73;
    --line: #29332f; --grid: #222b27; --change: #7d9cff; --change-soft: rgba(125, 156, 255, .17);
    --done: #4cc184; --doing: #f0a43a; --todo: #8c9993; --paused: #d27f7f;
    --b0: #35b8a6; --b1: #7f8ff7; --b2: #e3a04a; --b3: #ea7399; --b4: #9fc254; --b5: #b18ced;
    --on-branch: #0f1412; --root-bg: #e2e8e4; --root-fg: #0f1412; --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --paper: #131916; --surface: #1a211e; --ink: #e2e8e4; --muted: #9aa7a0; --faint: #6c7a73;
  --line: #29332f; --grid: #222b27; --change: #7d9cff; --change-soft: rgba(125, 156, 255, .17);
  --done: #4cc184; --doing: #f0a43a; --todo: #8c9993; --paused: #d27f7f;
  --b0: #35b8a6; --b1: #7f8ff7; --b2: #e3a04a; --b3: #ea7399; --b4: #9fc254; --b5: #b18ced;
  --on-branch: #0f1412; --root-bg: #e2e8e4; --root-fg: #0f1412; --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 14px;
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--change); outline-offset: 2px; }

/* Header */
.top {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--paper);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 22px; height: 22px; flex: none; }
.brand b { font-weight: 700; letter-spacing: -.01em; font-size: 15px; }
.brand code { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.mode .dot { width: 7px; height: 7px; }
.mode.live .dot { background: var(--done); }
.mode.demo .dot { background: var(--doing); }
.mode.off .dot { background: var(--paused); }
.top .spacer { flex: 1; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 10px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn[aria-pressed="true"] { border-color: var(--change); color: var(--change); background: var(--change-soft); }
kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* Main */
.main { display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
.map {
  position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--paper);
  background-image: radial-gradient(var(--grid) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
.map.dragging { cursor: grabbing; }
.map.dropping { box-shadow: inset 0 0 0 3px var(--change); }
.map svg { width: 100%; height: 100%; display: block; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom .btn { width: 32px; height: 32px; justify-content: center; padding: 0; font-family: var(--font-mono); }
.banner {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 3;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px 5px 14px;
  display: flex; align-items: center; gap: 10px; font-size: 13px; box-shadow: 0 6px 18px var(--shadow); white-space: nowrap;
}
.hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 90px); pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }

/* SVG map */
.link { fill: none; stroke-linecap: round; }
.node { cursor: pointer; }
.node text { fill: var(--ink); dominant-baseline: central; }
.node .t0 { fill: var(--root-fg); font-weight: 700; font-size: 20px; }
.node .t1 { fill: var(--on-branch); font-weight: 600; font-size: 15px; }
.node .t2 { font-weight: 500; font-size: 14px; }
.node .t3 { font-size: 13px; }
.node .pr { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; }
.node .st { font-size: 11px; font-weight: 500; }
.node .lift { filter: drop-shadow(0 4px 10px var(--shadow)); }
.node.dim { opacity: .2; }
.node .halo { fill: var(--change-soft); stroke: var(--change); stroke-width: 1.4; stroke-dasharray: 4 3; }
.node .sel { fill: none; stroke: var(--change); stroke-width: 2; }
.node.drop .sel-drop { fill: var(--change-soft); stroke: var(--change); stroke-width: 2; stroke-dasharray: 5 3; }
.node .newtag { fill: var(--change); }
.node .newtag-t { fill: var(--surface); font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; }
.node .ring { fill: none; stroke: var(--change); stroke-width: 1.6; }
.node .frame { fill: var(--surface); stroke: var(--line); }
.node .ph { fill: var(--faint); font-size: 11px; }
.toggle { fill: var(--surface); stroke-width: 1.4; cursor: pointer; }
.toggle-t { font-family: var(--font-mono); font-size: 9.5px; text-anchor: middle; pointer-events: none; }

/* Inline editor + node toolbar */
.edit-in {
  position: absolute; z-index: 4; font-family: var(--font-sans); color: var(--ink); background: var(--surface);
  border: 2px solid var(--change); border-radius: 6px; padding: 1px 6px; outline: none; min-width: 80px; box-sizing: border-box;
  box-shadow: 0 6px 18px var(--shadow);
}
.bar-tools {
  position: absolute; z-index: 3; display: flex; align-items: center; gap: 2px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 22px var(--shadow);
  white-space: nowrap; max-width: calc(100% - 16px); overflow-x: auto;
}
.bar-tools button { border: 0; background: none; border-radius: 6px; padding: 4px 7px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; flex: none; }
.bar-tools button:hover { background: var(--change-soft); }
.bar-tools button[aria-pressed="true"] { background: var(--change-soft); color: var(--change); }
.bar-tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; flex: none; }
.bar-tools .dot { width: 9px; height: 9px; }
.bar-tools .danger { color: var(--paused); }

/* Side ledger */
.side { border-left: 1px solid var(--line); background: var(--surface); min-height: 0; display: grid; grid-template-rows: auto 1fr; }
.tabs { display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 7px 10px 9px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.pane { overflow-y: auto; min-height: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 22px; }
.pane.src { padding: 0; gap: 0; }
.side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 0 0 10px; }
.ver-msg { font-size: 15px; font-weight: 600; line-height: 1.4; text-wrap: balance; margin: 0 0 6px; }
.ver-meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.sha { color: var(--change); }
.chg { display: flex; gap: 12px; font-variant-numeric: tabular-nums; margin-bottom: 8px; font-family: var(--font-mono); font-size: 12.5px; }
.chg span b { font-weight: 500; }
.chg .a { color: var(--done); } .chg .r { color: var(--paused); } .chg .s { color: var(--change); }
.chg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.chg-list li { display: grid; grid-template-columns: 16px 1fr; gap: 6px; line-height: 1.4; }
.chg-list .k { font-family: var(--font-mono); text-align: center; }
.chg-list .from { color: var(--faint); }
.none { color: var(--faint); font-size: 13px; margin: 0; line-height: 1.5; }
.overall { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.overall .pct { font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.overall .of { color: var(--muted); font-size: 13px; }
.pbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.pbar i { display: block; height: 100%; transition: width .4s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 9px 3px 7px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { border-color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.mods { display: flex; flex-direction: column; gap: 12px; }
.mod-h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 5px; }
.mod-h span:last-child { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mod .pbar { height: 6px; }
.src-head { padding: 10px 14px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); line-height: 1.5; }
#source {
  display: block; width: 100%; height: 100%; min-height: 320px; resize: none; border: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65; padding: 12px 14px; tab-size: 2; box-sizing: border-box;
}
#source:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--change); }
#source[readonly] { color: var(--muted); }

/* Commit rail */
.rail {
  border-top: 1px solid var(--line); background: var(--surface);
  padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center;
}
.rail-ctl { display: flex; gap: 6px; }
.rail-ctl .btn { width: 34px; height: 34px; justify-content: center; padding: 0; }
.track { overflow-x: auto; min-width: 0; }
.commits { display: flex; list-style: none; margin: 0; padding: 0 0 2px; position: relative; min-width: max-content; }
.commits::before { content: ""; position: absolute; left: 10px; right: 10px; top: 9px; height: 2px; background: var(--line); }
.commit { position: relative; flex: none; width: 168px; }
.commit button { border: 0; background: none; padding: 0 8px 0 0; text-align: left; width: 100%; display: grid; grid-template-rows: 20px auto auto; gap: 3px; }
.commit .knot { width: 12px; height: 12px; border-radius: 50%; margin: 4px 0 0 4px; background: var(--surface); border: 2px solid var(--faint); position: relative; z-index: 1; box-sizing: border-box; }
.commit.past .knot { border-color: var(--ink); background: var(--ink); }
.commit.on .knot { border-color: var(--change); background: var(--change); box-shadow: 0 0 0 4px var(--change-soft); }
.commit.wip .knot { border-style: dashed; }
.commit .msg { font-size: 12.5px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.commit .meta { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.commit.on .msg { font-weight: 600; }
.commit.on .meta .h { color: var(--change); }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9;
  background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 22px var(--shadow);
}

@media (max-width: 760px) {
  body { overflow: auto; height: auto; display: block; }
  .main { display: block; }
  .map { height: 64vh; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .pane { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #source { min-height: 360px; }
  .rail { grid-template-columns: 1fr; }
  .commit { width: 140px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pbar i { transition: none; } }
</style>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><circle cx="5" cy="11" r="3" fill="var(--ink)"/><path d="M8 11 C12 11 11 5 15 5 M8 11 C12 11 11 17 15 17" fill="none" stroke="var(--b0)" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="5" r="2.4" fill="var(--b1)"/><circle cx="17" cy="17" r="2.4" fill="var(--b2)"/></svg>
    <b>Mindgit</b><code id="file"></code>
  </div>
  <span class="mode" id="mode"><span class="dot"></span><span id="mode-t"></span></span>
  <div class="spacer"></div>
  <div class="tools">
    <button class="btn" id="btn-undo" title="撤销 (Ctrl/⌘+Z)">撤销</button>
    <button class="btn" id="btn-diff" aria-pressed="true" title="高亮这个版本相对上一版的变化">显示变更</button>
    <button class="btn" id="btn-expand">全部展开</button>
    <button class="btn" id="btn-fold">收起到模块</button>
  </div>
</header>

<div class="main">
  <div class="map" id="map">
    <svg id="svg" aria-label="思维导图">
      <g id="vp"><g id="links"></g><g id="nodes"></g></g>
    </svg>
    <div class="banner" id="banner" hidden><span id="banner-t"></span><button class="btn" id="to-latest">回到最新</button></div>
    <div class="bar-tools" id="toolbar" hidden></div>
    <div class="hint" id="hint"><span>点选节点编辑</span><span><kbd>Tab</kbd> 子节点</span><span><kbd>Enter</kbd> 同级</span><span><kbd>F2</kbd>/双击 改名</span><span><kbd>1</kbd>–<kbd>4</kbd> 状态</span><span>拖入图片</span></div>
    <div class="zoom">
      <button class="btn" id="z-in" aria-label="放大">+</button>
      <button class="btn" id="z-out" aria-label="缩小">−</button>

    <input type="file" id="pick" accept="image/*" hidden>
  </div>
  <aside class="side">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-ov" aria-selected="true">概览</button>
      <button class="tab" role="tab" id="tab-src" aria-selected="false">Markdown</button>
    </div>
    <div class="pane" id="pane-ov">
      <section>
        <h2>当前版本</h2>
        <p class="ver-msg" id="ver-msg"></p>
        <div class="ver-meta" id="ver-meta"></div>
      </section>
      <section>
        <h2>相对上一版</h2>
        <div id="changes"></div>
      </section>
      <section>
        <h2>进度</h2>
        <div class="overall"><span class="pct" id="pct"></span><span class="of" id="of"></span></div>
        <div class="pbar" id="pbar"></div>
        <div class="legend" id="legend"></div>
      </section>
      <section>
        <h2>模块</h2>
        <div class="mods" id="mods"></div>
      </section>
    </div>
    <div class="pane src" id="pane-src" hidden>
      <div class="src-head" id="src-note">在这里改 Markdown，导图会同步更新</div>
      <textarea id="source" spellcheck="false" aria-label="Markdown 源文件"></textarea>
    </div>
  </aside>
</div>

<footer class="rail">
  <div class="rail-ctl">
    <button class="btn" id="prev" aria-label="上一个版本">‹</button>
    <button class="btn" id="play" aria-label="回放全部版本">▶</button>
    <button class="btn" id="next" aria-label="下一个版本">›</button>
  </div>
  <div class="track" id="track"><ol class="commits" id="commits"></ol></div>
</footer>
<div class="toast" id="toast" hidden></div>

<script>/*__PARSER__*/</script>
<script id="mg-data" type="application/json">__DATA__</script>
<script>
(function () {
  const P = window.MindgitParse;
  const DATA = JSON.parse(document.getElementById('mg-data').textContent);
  const LIVE = DATA.mode === 'live';
  const ASSETS = Object.assign({}, DATA.assets || {});
  const STATUS_ORDER = ['done', 'doing', 'todo', 'paused'];
  const L = P.STATUS_LABEL, SEP = P.SEP;
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  // ---------- state ----------
  let base = DATA.commits.filter(c => !c.wip);
  let md = DATA.commits[DATA.commits.length - 1].content;
  let commits = [];
  let cur = 0;
  let showDiff = true, filter = null, collapsed = new Set();
  let view = { x: 40, y: 0, k: 1 };
  let pos = new Map();
  let playing = null;
  let sel = null;
  let undo = [], redo = [];
  let serverHash = DATA.hash || null, saveTimer = null, saving = false;
  let lastNodes = [];

  function rebuildCommits() {
    base.forEach(c => { if (!c._tree) c._tree = P.parse(c.content); });
    commits = base.slice();
    const last = base[base.length - 1];
    if (!last || last.content !== md) {
      commits.push({ sha: '', short: 'WIP', date: new Date().toISOString(), author: '', message: '未提交的修改', content: md, wip: true, _tree: P.parse(md) });
    }
  }
  const latest = () => cur === commits.length - 1;
  const tree = () => commits[cur]._tree;

  $('file').textContent = DATA.file;
  function setMode(kind, text) { $('mode').className = 'mode ' + kind; $('mode-t').textContent = text; }
  setMode(LIVE ? 'live' : 'demo', LIVE ? '已连接本地文件' : '演示：改动只保存在本页');

  // ---------- measuring ----------
  const ctx = document.createElement('canvas').getContext('2d');
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const FONTS = ['700 20px ', '600 15px ', '500 14px ', '400 13px '].map(f => f + css('--font-sans'));
  function tw(text, d) { ctx.font = FONTS[Math.min(d, 3)]; return ctx.measureText(text || ' ').width; }
  const chipW = s => Math.round(28 + tw(L[s], 3) * 11 / 13);

  // ---------- images ----------
  const imgSize = new Map();
  function resolveSrc(src) {
    if (!src) return null;
    if (/^(data:|blob:)/.test(src)) return src;
    if (ASSETS[src]) return ASSETS[src];
    if (/^https?:/.test(src)) return src;
    return LIVE ? '/files/' + src.split('/').map(encodeURIComponent).join('/') : null;
  }
  function sizeOf(src) {
    const url = resolveSrc(src);
    if (!url) return { w: 150, h: 84, missing: true };
    if (imgSize.has(url)) return imgSize.get(url);
    imgSize.set(url, { w: 160, h: 100, loading: true });
    const im = new Image();
    im.onload = () => {
      const nw = im.naturalWidth || 160, nh = im.naturalHeight || 100;
      const r = Math.min(180 / nw, 120 / nh, 1);

    };

    else if (a === 'pr') setPriority(v);
    else if (a === 'child') addChild();
    else if (a === 'sib') addSibling();
    else if (a === 'img') $('pick').click();
    else if (a === 'noimg') edit(n => P.updateNode(md, n, { image: null }));
    else if (a === 'ren') startRename();
    else if (a === 'del') removeSel();
  });

  // Images: pick, drop or paste
  $('pick').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) attachImage(f, sel); });
  mapEl.addEventListener('dragover', e => {
    if (![...e.dataTransfer.items].some(i => i.kind === 'file')) return;
    e.preventDefault(); mapEl.classList.add('dropping');
    document.querySelectorAll('.node.drop').forEach(x => x.classList.remove('drop'));
    const g = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node'); if (g) g.classList.add('drop');
  });
  mapEl.addEventListener('dragleave', e => { if (e.target === mapEl || !mapEl.contains(e.relatedTarget)) mapEl.classList.remove('dropping'); });
  mapEl.addEventListener('drop', e => {
    e.preventDefault(); mapEl.classList.remove('dropping');
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    const g = document.elementFromPoint(e.clientX, e.clientY)?.closest('.node');
    document.querySelectorAll('.node.drop').forEach(x => x.classList.remove('drop'));
    if (!f) return toast('只能拖入图片文件');
    const id = g ? g.getAttribute('data-id') : sel;
    if (id == null) return toast('把图片拖到一个节点上');
    attachImage(f, id);
  });
  document.addEventListener('paste', e => {
    if (e.target.closest('textarea,input') || sel == null) return;
    const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
    if (f) { e.preventDefault(); attachImage(f, sel); }
  });
  async function attachImage(file, id) {
    if (!latest()) return toast('回到最新版本才能编辑');
    const ext = (file.type.split('/')[1] || 'png').replace('svg+xml', 'svg').replace('jpeg', 'jpg');
    const named = file.name && !/^image\.\w+$/.test(file.name);
    const stem = (named ? file.name.replace(/\.[^.]+$/, '') : 'image-' + Date.now().toString(36)).replace(/[^\w一-龥-]+/g, '-').slice(0, 40);
    let path = 'assets/' + stem + '.' + ext;
    if (LIVE) {
      try {
        const r = await fetch('/api/upload?name=' + encodeURIComponent(stem + '.' + ext), { method: 'POST', body: file });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.status);
        path = j.src;
      } catch (err) { return toast('图片没保存成功：' + err.message); }
    } else {
      ASSETS[path] = URL.createObjectURL(file);
    }
    sel = id;
    if (edit(n => P.updateNode(md, n, { image: { alt: stem, src: path } }))) toast(LIVE ? '图片已保存到 ' + path : '已插入图片（演示模式下只在本页显示）');
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,textarea')) return;
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
    if (mod) return;
    if (sel != null && latest()) {
      const n = nodeById(sel);
      const keyStatus = { '1': 'todo', '2': 'doing', '3': 'done', '4': 'paused' }[e.key];
      if (keyStatus) { e.preventDefault(); return setStatus(keyStatus); }
      if (e.key === '0') { e.preventDefault(); return edit(n => P.updateNode(md, n, { status: null })); }
      if (e.key === 'Tab') { e.preventDefault(); return addChild(); }
      if (e.key === 'Enter') { e.preventDefault(); return addSibling(); }
      if (e.key === 'F2' || e.key === ' ') { e.preventDefault(); return startRename(); }
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return removeSel(); }
      if (e.key === 'Escape') return select(null);
      if (n && e.key.startsWith('Arrow')) {
        e.preventDefault();
        const parent = n.depth ? nodeById(P.parentId(n.id)) : null;
        const sibs = parent ? parent.children : [];
        const i = sibs.findIndex(c => c.id === n.id);
        if (e.key === 'ArrowLeft' && parent) select(parent.id);
        if (e.key === 'ArrowRight' && n.children.length) { collapsed.delete(n.id); select(n.children[0].id); }
        if (e.key === 'ArrowUp' && i > 0) select(sibs[i - 1].id);
        if (e.key === 'ArrowDown' && i >= 0 && i < sibs.length - 1) select(sibs[i + 1].id);
        return;
      }
    }
    if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
    if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
  });

  // Markdown source pane
  const src = $('source');
  let srcTimer = null;
  src.addEventListener('input', () => {
    clearTimeout(srcTimer);
    srcTimer = setTimeout(() => { if (latest()) commit(src.value, { fromSource: true }); }, 250);
  });
  function showTab(which) {
    $('tab-ov').setAttribute('aria-selected', which === 'ov'); $('tab-src').setAttribute('aria-selected', which === 'src');
    $('pane-ov').hidden = which !== 'ov'; $('pane-src').hidden = which !== 'src';
  }
  $('tab-ov').onclick = () => showTab('ov');
  $('tab-src').onclick = () => showTab('src');

  // ---------- live sync with the local file ----------
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
  async function save() {
    saveTimer = null;
    if (saving) return scheduleSave();
    saving = true;
    const content = md;
    try {
      const r = await fetch('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ content, base: serverHash }) });
      const j = await r.json();
      if (r.status === 409) { applyServer(j); toast('文件在别处被修改了，已载入最新内容'); }
      else if (!r.ok) throw new Error(j.error || r.status);
      else { serverHash = j.hash; setMode('live', '已保存到 ' + DATA.file); }
    } catch (err) { setMode('off', '保存失败，请确认 mindgit serve 还在运行'); }
    saving = false;
  }
  function applyServer(state) {
    serverHash = state.hash;
    const wasLatest = latest();
    base = state.commits.filter(c => !c.wip);
    if (state.content !== md) { md = state.content; undo = []; redo = []; }
    if (src !== document.activeElement) src.value = md;
    rebuildCommits();
    if (wasLatest || cur >= commits.length) cur = commits.length - 1;
    render(false);
  }
  if (LIVE) {
    const es = new EventSource('/api/events');
    es.onmessage = ev => {
      const state = JSON.parse(ev.data);
      const sameHistory = state.commits.filter(c => !c.wip).map(c => c.sha).join() === base.map(c => c.sha).join();
      if (state.hash === serverHash && sameHistory) return;
      if ((saveTimer || saving) && state.content !== md) return; // our own save is on its way
      applyServer(state);
      setMode('live', '已连接本地文件');
    };
    es.onerror = () => setMode('off', '和本地文件的连接断开了');
    es.onopen = () => setMode('live', '已连接本地文件');
  } else {
    $('src-note').textContent = '在这里改 Markdown，导图会同步更新。演示模式不会写回文件，用插件的 /mindgit:open 打开才会。';
  }

  // ---------- side ledger ----------
  const fmt = iso => {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getMonth() + 1}月${d.getDate()}日 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  };
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function renderSide(c, dd) {
    $('ver-msg').textContent = c.message;
    $('ver-meta').innerHTML = `<span class="sha">${esc(c.short)}</span><span>${esc(c.author || '')}</span><span>${fmt(c.date)}</span>`;
    const box = $('changes');
    if (dd.initial) box.innerHTML = '<p class="none">这是第一个版本。</p>';
    else {
      const rows = [];
      dd.addedTop.slice(0, 8).forEach(n => rows.push(`<li><span class="k" style="color:var(--done)">+</span><span>${esc(n.text)}</span></li>`));
      dd.status.slice(0, 8).forEach(s => rows.push(`<li><span class="k" style="color:var(--change)">~</span><span>${esc(s.node.text)} <span class="from">${s.from ? L[s.from] : '无'} →</span> <span style="color:var(--${s.to || 'todo'})">${s.to ? L[s.to] : '无'}</span></span></li>`));
      dd.removedTop.slice(0, 8).forEach(n => rows.push(`<li><span class="k" style="color:var(--paused)">−</span><span style="text-decoration:line-through;color:var(--muted)">${esc(n.text)}</span></li>`));
      box.innerHTML = `<div class="chg"><span class="a"><b>+${dd.added.length}</b> 新增</span><span class="s"><b>${dd.status.length}</b> 状态</span><span class="r"><b>−${dd.removed.length}</b> 删除</span></div>` +
        (rows.length ? `<ul class="chg-list">${rows.join('')}</ul>` : '<p class="none">导图结构没有变化。</p>');
    }
    const s = P.stats(c._tree);
    const pct = s.total ? Math.round(s.counts.done / s.total * 100) : 0;
    $('pct').textContent = pct + '%';
    $('of').textContent = `${s.counts.done} / ${s.total} 项完成`;
    $('pbar').innerHTML = STATUS_ORDER.map(k => `<i style="width:${s.total ? s.counts[k] / s.total * 100 : 0}%;background:var(--${k})"></i>`).join('');
    $('legend').innerHTML = STATUS_ORDER.map(k => `<button class="chip" data-k="${k}" aria-pressed="${filter === k}"><span class="dot" style="background:var(--${k})"></span>${L[k]} ${s.counts[k]}</button>`).join('');
    $('legend').querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = filter === b.dataset.k ? null : b.dataset.k; render(false); });
    $('mods').innerHTML = s.modules.length ? s.modules.map(m => `<div class="mod"><div class="mod-h"><span>${esc(m.node.text || '未分组')}</span><span>${m.done}/${m.total}</span></div>
      <div class="pbar">${STATUS_ORDER.map(k => `<i style="width:${m[k] / m.total * 100}%;background:var(--${k})"></i>`).join('')}</div></div>`).join('')
      : '<p class="none">给节点加上 [待开发] [进行中] [完成] 标签后，这里会显示每个模块的进度。</p>';
    src.readOnly = !latest();
    const want = latest() ? md : c.content;
    if (src !== document.activeElement && src.value !== want) src.value = want;
  }

  // ---------- commit rail ----------
  let railKey = '';
  function renderRail() {
    const ol = $('commits');
    const key = commits.map(c => c.sha || 'wip').join();
    if (key !== railKey) {
      railKey = key;
      ol.textContent = '';
      commits.forEach((c, i) => {
        const li = document.createElement('li');
        li.className = 'commit' + (c.wip ? ' wip' : '');
        li.innerHTML = `<button type="button"><span class="knot"></span><span class="msg">${esc(c.message)}</span><span class="meta"><span class="h">${esc(c.short)}</span> · ${fmt(c.date)}</span></button>`;
        li.querySelector('button').onclick = () => { stop(); go(i); };
        ol.appendChild(li);
      });
    }
    [...ol.children].forEach((li, i) => { li.classList.toggle('on', i === cur); li.classList.toggle('past', i < cur); });
    const on = ol.children[cur];
    if (on) { const tr = $('track'); tr.scrollLeft = Math.max(0, on.offsetLeft - tr.clientWidth / 2 + 84); }
    $('prev').disabled = cur === 0; $('next').disabled = cur === commits.length - 1;
  }
  function go(i) { cur = Math.max(0, Math.min(commits.length - 1, i)); if (!latest()) closeEditor(false); render(false); }
  $('to-latest').onclick = () => { stop(); go(commits.length - 1); };
  $('prev').onclick = () => { stop(); go(cur - 1); };
  $('next').onclick = () => { stop(); go(cur + 1); };
  function stop() { if (playing) { clearInterval(playing); playing = null; $('play').textContent = '▶'; $('play').setAttribute('aria-label', '回放全部版本'); } }
  $('play').onclick = () => {
    if (playing) return stop();
    sel = null;
    if (cur === commits.length - 1) go(0);
    $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', '暂停回放');
    playing = setInterval(() => { if (cur >= commits.length - 1) return stop(); go(cur + 1); }, 1600);
  };

  let toastTimer = null;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

  const start = () => { rebuildCommits(); cur = commits.length - 1; src.value = md; render('first'); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start, start);
})();
</script>
